<!DOCTYPE html>

<title>体素分层搭建查看器 - 完整预览+色卡版</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{padding:12px;max-width:1400px;margin:0 auto;background:#f4f5f7}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
.app{display:grid;grid-template-columns:1fr 320px;gap:12px}
#mainCanvasWrap{width:100%;height:560px;background:#eef0f3;border-radius:8px;position:relative;overflow:hidden}
#miniCanvasWrap{width:100%;height:180px;background:#eef0f3;border-radius:8px;position:relative;overflow:hidden}
#palette{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.color-item{border:2px solid #ddd;border-radius:8px;padding:6px;text-align:center;cursor:pointer;background:#fafafa}
.color-item:hover{border-color:#333}
.color-swatch{width:100%;height:32px;border-radius:4px;margin-bottom:4px;border:1px solid #0002}
.info-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.layer-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#ccc;border-radius:24px;cursor:pointer}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked + .slider{background:#4caf50}
input:checked + .slider:before{transform:translateX(20px)}
input[type="range"]{width:100%}
</style>
</head>
<body>

<div class="card">
<h3>📂 打开 GOX / VOX 文件</h3>
<input type="file" id="fileInput" accept=".gox,.vox">
<p>所有解析在本地完成，文件不会上传。主视图左键拖拽旋转、滚轮缩放、中键或 Shift+拖拽平移，双击回正；左下始终显示完整模型。</p>
</div>

<div class="app">
<div>
<div class="card">
<div id="mainCanvasWrap">
<div style="padding:8px;position:absolute;top:0;right:0;z-index:2;text-align:right;background:rgba(255,255,255,.75);border-radius:0 0 0 8px;font-size:12px;line-height:1.6;color:#444">
<div>左键拖拽：旋转</div>
<div>滚轮：缩放</div>
<div>中键 / Shift+拖拽：平移</div>
<div>双击：回正</div>
</div>
<canvas id="mainCanvas"></canvas>
</div>

<div class="info-row">
<div style="flex:1;min-width:260px">
<div>当前搭建层 Z = <span id="currentZValue">0</span></div>
<input type="range" id="layerSlider" min="0" max="0" value="0">
<div style="display:flex;justify-content:space-between;font-size:12px;color:#666">
<span>底层</span><span>顶层</span>
</div>
</div>

<div class="layer-controls">
<label class="switch">
<input type="checkbox" id="goldSwitch" checked>
<span class="slider"></span>
</label>
<span>已搭层金色</span>
</div>

<div class="layer-controls">
<label class="switch">
<input type="checkbox" id="upperTransparent" checked>

</label>
<span>上层半透明</span>
</div>

<div>
<p>当前层积木：<span id="voxelCount">0</span> 个</p>
<p>总积木数：<span id="totalCount">0</span> 个</p>
</div>
</div>
</div>

<div class="card">

<div id="miniCanvasWrap">

</div>
</div>

</div>
</div>

};

async function parseVox(arrayBuffer){
  const view = new DataView(arrayBuffer);
  let ptr = 0;
  const id = new TextDecoder().decode(new Uint8Array(arrayBuffer, ptr, 4));
  ptr += 4;
  if (id !== 'VOX ') throw new Error("不是合法vox文件");
  view.getUint32(ptr, true);
  ptr += 4;

  let voxels = [];
  palette = JSON.parse(JSON.stringify(MV_DEFAULT_PALETTE));

  while (ptr < arrayBuffer.byteLength) {
    const cid = new TextDecoder().decode(new Uint8Array(arrayBuffer, ptr, 4));
    ptr += 4;
    const csize = view.getUint32(ptr, true);
    ptr += 4;
    view.getUint32(ptr, true);
    ptr += 4;

    if (cid === 'SIZE') {
      ptr += csize;
    } else if (cid === 'XYZI') {
      const num = view.getUint32(ptr, true);
      ptr += 4;
      for (let i = 0; i < num; i++) {
        const x = view.getUint8(ptr);
        const y = view.getUint8(ptr + 1);
        const z = view.getUint8(ptr + 2);
        const c = view.getUint8(ptr + 3);
        ptr += 4;
        voxels.push({x, y, z, colorIndex: c});
      }
    } else if (cid === 'RGBA') {
      for (let i = 0; i < 255; i++) {
        const r = view.getUint8(ptr);
        const g = view.getUint8(ptr + 1);
        const b = view.getUint8(ptr + 2);
        const a = view.getUint8(ptr + 3);
        palette[i+1] = {r,g,b,a};
        ptr += 4;
      }
      ptr += 4;
    } else {
      ptr += csize;
    }
  }
  return voxels;
}

async function parseGox(arrayBuffer){
  const u8 = new Uint8Array(arrayBuffer);
  const txt = new TextDecoder().decode(u8);
  const voxels = [];
  const lines = txt.split('\n');
  palette = JSON.parse(JSON.stringify(MV_DEFAULT_PALETTE));
  for (const line of lines) {
    const m = line.match(/v (-?\d+) (-?\d+) (-?\d+) (\d+)/);
    if (m) {
      voxels.push({
        x: parseInt(m[1]),
        y: parseInt(m[2]),
        z: parseInt(m[3]),
        colorIndex: parseInt(m[4])
      });
    }
  }
  return voxels;
}

function buildUsedPalette(){
  const count = {};
  for (const v of allVoxels) {
    count[v.colorIndex] = (count[v.colorIndex] || 0) + 1;
  }
  usedColors = Object.keys(count).map(Number).sort((a,b)=>count[b]-count[a]);
  renderPalette();
}

function renderPalette(){
  paletteBox.innerHTML = "";
  for (const idx of usedColors) {
    const pal = palette[idx] || {r:200,g:200,b:200,a:255};
    const item = document.createElement("div");
    item.className = "color-item";
    item.innerHTML = `
      <div class="color-swatch" style="background:rgb(${pal.r},${pal.g},${pal.b})"></div>
      <div>#${idx}</div>
    `;
    item.onclick = () => {
      highlightColorIndex = highlightColorIndex === idx ? null : idx;
      drawMain();
    };
    paletteBox.appendChild(item);
  }
}

function fitCamera(cam, canvas){
  const probe = {rotX: cam.rotX, rotY: cam.rotY, scale: 1};
  const b = getBounds(allVoxels, probe);
  const w = Math.max(b.maxX - b.minX, 1);
  const h = Math.max(b.maxY - b.minY, 1);
  cam.scale = Math.min(canvas.width / w * 0.85, canvas.height / h * 0.85);
}

fileInput.onchange = async (evt) => {
  const f = evt.target.files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  let voxels;

  try {
    if (f.name.endsWith('.vox')) {
      voxels = await parseVox(buf);
    } else if (f.name.endsWith('.gox')) {
      voxels = await parseGox(buf);
    } else {
      alert("仅支持 .gox / .vox");
      return;
    }

    allVoxels = voxels;
    if (allVoxels.length === 0) {
      alert("解析成功，但没有体素！");
      return;
    }

    const zList = allVoxels.map(v => v.z);
    minZ = Math.min(...zList);
    maxZ = Math.max(...zList);
    currentZ = minZ;

    layerSlider.min = minZ;
    layerSlider.max = maxZ;
    layerSlider.value = currentZ;
    currentZValue.textContent = currentZ;

    totalCountEl.textContent = allVoxels.length;
    buildUsedPalette();

    camera.rotX = -0.4; camera.rotY = 0.6; camera.panX = 0; camera.panY = 0;
    miniCamera.rotX = -0.4; miniCamera.rotY = 0.6; miniCamera.panX = 0; miniCamera.panY = 0;
    fitCamera(camera, mainCanvas);
    fitCamera(miniCamera, miniCanvas);
    camera.scale = Math.min(Math.max(camera.scale, 2), 80);
    miniCamera.scale = Math.min(Math.max(miniCamera.scale, 1), 40);

    drawMain();
    drawMini();
  } catch (err) {
    console.error(err);
    alert("解析失败：" + err.message);
  }
};

function project(x, y, z, cam){
  let px = x * Math.cos(cam.rotY) - y * Math.sin(cam.rotY);
  let py = x * Math.sin(cam.rotY) + y * Math.cos(cam.rotY);
  const ty = py * Math.cos(cam.rotX) - z * Math.sin(cam.rotX);
  const tz = py * Math.sin(cam.rotX) + z * Math.cos(cam.rotX);
  return {
    screenX: 0 + px * cam.scale,
    screenY: 0 - ty * cam.scale,
    depth: tz
  };
}

function getBounds(voxels, cam){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for (const v of voxels) {
    const p = project(v.x, v.y, v.z, cam);
    minX = Math.min(minX, p.screenX);
    minY = Math.min(minY, p.screenY);
    maxX = Math.max(maxX, p.screenX);
    maxY = Math.max(maxY, p.screenY);
  }
  return {minX,minY,maxX,maxY};
}

function drawMain(){
  ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
  if (allVoxels.length === 0) return;

  const goldEnabled = goldSwitch.checked;
  const upperHide = !upperTransparent.checked;

  const sorted = allVoxels.slice().sort((a,b)=>{
    const pa = project(a.x,a.y,a.z,camera);
    const pb = project(b.x,b.y,b.z,camera);
    return pa.depth - pb.depth;
  });

  if (camera.scale > 80) camera.scale = 80;
  if (camera.scale < 2) camera.scale = 2;
  const scale = camera.scale;
  const bounds = getBounds(allVoxels, {rotX: camera.rotX, rotY: camera.rotY, scale: 1});
  const offsetX = mainCanvas.width/2 - (bounds.minX + bounds.maxX)/2 * scale + camera.panX;
  const offsetY = mainCanvas.height/2 - (bounds.minY + bounds.maxY)/2 * scale + camera.panY;

  let currentLayerCount = 0;

  for (const v of sorted) {
    const p = project(v.x, v.y, v.z, camera);
    const s = scale * 0.92;
    const sx = offsetX + p.screenX * scale / camera.scale;
    const sy = offsetY + p.screenY * scale / camera.scale;

    let fillColor;
    let opacity = 1;

    if (v.z < currentZ) {
      fillColor = goldEnabled ? {r:255,g:180,b:50} : palette[v.colorIndex] || {r:200,g:200,b:200};
    } else if (v.z === currentZ) {
      currentLayerCount++;
      fillColor = palette[v.colorIndex] || {r:200,g:200,b:200};
    } else {
      if (upperHide) continue;
      fillColor = palette[v.colorIndex] || {r:200,g:200,b:200};
      opacity = 0.35;
    }

    if (highlightColorIndex !== null && v.colorIndex === highlightColorIndex) {
      opacity = 1;
    }

    ctx.globalAlpha = opacity;
    ctx.fillStyle = `rgb(${fillColor.r},${fillColor.g},${fillColor.b})`;
    ctx.fillRect(sx - s/2, sy - s/2, s, s);

    if (v.z === currentZ) {
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2;
    } else if (highlightColorIndex !== null && v.colorIndex === highlightColorIndex) {
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
    } else {
      ctx.strokeStyle = `rgba(0,0,0,${opacity*0.4})`;
      ctx.lineWidth = 1;
    }
    ctx.strokeRect(sx - s/2, sy - s/2, s, s);
  }
  ctx.globalAlpha = 1;
  voxelCountEl.textContent = currentLayerCount;
}

function drawMini(){
  miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
  if (allVoxels.length === 0) return;

  const sorted = allVoxels.slice().sort((a,b)=>{
    const pa = project(a.x,a.y,a.z,miniCamera);
    const pb = project(b.x,b.y,b.z,miniCamera);
    return pa.depth - pb.depth;
  });

  if (miniCamera.scale > 40) miniCamera.scale = 40;
  if (miniCamera.scale < 1) miniCamera.scale = 1;
  const scale = miniCamera.scale;
  const bounds = getBounds(allVoxels, {rotX: miniCamera.rotX, rotY: miniCamera.rotY, scale: 1});
  const offsetX = miniCanvas.width/2 - (bounds.minX + bounds.maxX)/2 * scale;
  const offsetY = miniCanvas.height/2 - (bounds.minY + bounds.maxY)/2 * scale;

  for (const v of sorted) {
    const p = project(v.x, v.y, v.z, miniCamera);
    const s = scale * 0.92;
    const sx = offsetX + p.screenX * scale / miniCamera.scale;
    const sy = offsetY + p.screenY * scale / miniCamera.scale;
    const pal = palette[v.colorIndex] || {r:200,g:200,b:200,a:255};
    miniCtx.fillStyle = `rgb(${pal.r},${pal.g},${pal.b})`;
    miniCtx.fillRect(sx - s/2, sy - s/2, s, s);
    miniCtx.strokeStyle = "rgba(0,0,0,0.4)";
    miniCtx.lineWidth = 1;
    miniCtx.strokeRect(sx - s/2, sy - s/2, s, s);
  }
}

// ===== 导出每层俯视图 ZIP（当前层原色 + 下方已搭层金色参照） =====
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// STORE(不压缩) ZIP 打包，纯本地无依赖
function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  for (const f of files) {
    const nameB = enc.encode(f.name);
    const crc = crc32(f.data);
    const lh = new Uint8Array(30 + nameB.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, dosTime, true);
    dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, f.data.length, true);
    dv.setUint32(22, f.data.length, true);
    dv.setUint16(26, nameB.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameB, 30);
    chunks.push(lh, f.data);

    const ch = new Uint8Array(46 + nameB.length);
    const dv2 = new DataView(ch.buffer);
    dv2.setUint32(0, 0x02014b50, true);
    dv2.setUint16(4, 20, true);
    dv2.setUint16(6, 20, true);
    dv2.setUint16(8, 0x0800, true);
    dv2.setUint16(10, 0, true);
    dv2.setUint16(12, dosTime, true);
    dv2.setUint16(14, dosDate, true);
    dv2.setUint32(16, crc, true);
    dv2.setUint32(20, f.data.length, true);
    dv2.setUint32(24, f.data.length, true);
    dv2.setUint16(28, nameB.length, true);
    dv2.setUint32(42, offset, true);
    ch.set(nameB, 46);
    central.push(ch);
    offset += lh.length + f.data.length;
  }
  const centralSize = central.reduce((s, c) => s + c.length, 0);
  const end = new Uint8Array(22);
  const dv3 = new DataView(end.buffer);
  dv3.setUint32(0, 0x06054b50, true);
  dv3.setUint16(8, files.length, true);
  dv3.setUint16(10, files.length, true);
  dv3.setUint32(12, centralSize, true);
  dv3.setUint32(16, offset, true);
  const out = new Uint8Array(offset + centralSize + 22);
  let pos = 0;
  for (const c of chunks) { out.set(c, pos); pos += c.length; }
  for (const c of central) { out.set(c, pos); pos += c.length; }
  out.set(end, pos);
  return out;
}

document.getElementById('exportZipBtn').onclick = async function () {
  if (!allVoxels || allVoxels.length === 0) { alert("请先打开 .vox / .gox 文件"); return; }
  const btn = this;
  btn.disabled = true;
  try {
    const PX = 32, MARGIN = 40;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const v of allVoxels) {
      if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
      if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
    }
    const W = (maxX - minX + 1) * PX + MARGIN * 2;
    const H = (maxY - minY + 1) * PX + MARGIN * 2;
    const byZ = {};
    for (const v of allVoxels) { (byZ[v.z] = byZ[v.z] || []).push(v); }

    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c2 = cv.getContext('2d');
    const cell = (v) => [MARGIN + (v.x - minX) * PX, MARGIN + (maxY - v.y) * PX]; // y大(后)在上，前在下
    const drawCell = (v, col, stroke) => {
      const [px, py] = cell(v);
      const s = PX * 0.92;
      c2.fillStyle = col;
      c2.fillRect(px - s / 2, py - s / 2, s, s);
      c2.strokeStyle = stroke;
      c2.lineWidth = 2;
      c2.strokeRect(px - s / 2, py - s / 2, s, s);
    };

    const files = [];
    const goldMap = new Map(); // "x,y" -> v  下方已搭层的投影
    const totalCount = allVoxels.length;

    for (let z = minZ; z <= maxZ; z++) {
      c2.globalAlpha = 1;
      c2.fillStyle = '#ffffff';
      c2.fillRect(0, 0, W, H);

      // 金色参照：下方已搭层投影（远距悬浮件的对位依据）
      for (const v of goldMap.values()) {
        drawCell(v, 'rgb(255,180,50)', 'rgba(0,0,0,0.3)');
      }

      // 当前层原色
      let n = 0;
      for (const v of (byZ[z] || [])) {
        n++;
        const pal = palette[v.colorIndex] || { r: 200, g: 200, b: 200 };
        drawCell(v, `rgb(${pal.r},${pal.g},${pal.b})`, '#000');
        goldMap.set(v.x + ',' + v.y, v);
      }

      // 层标注
      c2.globalAlpha = 1;
      c2.fillStyle = '#333';
      c2.font = 'bold 22px Consolas, monospace';
      c2.fillText(`Z = ${z}    ${n} / ${totalCount} pcs`, MARGIN, MARGIN - 12);

      const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
      files.push({
        name: `z${String(z).padStart(2, '0')}_${n}pcs.png`,
        data: new Uint8Array(await blob.arrayBuffer())
      });
      btn.textContent = `导出中 ${z - minZ + 1} / ${maxZ - minZ + 1} 层`;
      if ((z - minZ) % 4 === 3) await new Promise(r => setTimeout(r, 0));
    }

    const baseName = (fileInput.files[0] && fileInput.files[0].name || 'model').replace(/\.(gox|vox)$/i, '');
    const zip = makeZip(files);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zip], { type: 'application/zip' }));
    a.download = `${baseName}_layers.zip`;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (err) {
    console.error(err);
    alert("导出失败：" + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "导出每层俯视图 ZIP";
  }
};
